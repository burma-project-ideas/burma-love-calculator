<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="love-icon.svg" />
    <title>Love Calculator | Premium Red Edition</title>
    <base href="/" />
    <link rel="stylesheet" href="css/site.css" />
    <link href="blazor-burma-love-calculator.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
    <style>
        .loader-container {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #fff5f5;
            gap: 1rem;
            z-index: 9999;
        }
        .loader-mark { width: 48px; height: 48px; }
        .loader-text {
            margin: 0;
            color: #991b1b;
            font-family: system-ui, -apple-system, sans-serif;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            font-size: 0.75rem;
        }
    </style>
</head>

<body>
    <div id="app">
        <div class="loader-container" role="status" aria-live="polite">
            <img src="love-icon.svg" alt="" class="loader-mark" />
            <p class="loader-text">Loading Love Calculator...</p>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss" aria-hidden="true">×</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
